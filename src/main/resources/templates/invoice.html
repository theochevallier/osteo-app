<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
<!--    <link rel="preconnect" href="https://fonts.gstatic.com">-->
    <link href="https://fonts.googleapis.com/css2?family=Helvetica:wght@400;500;600;700" rel="stylesheet">
        <style>
            body {
                font-family: Helvetica, sans-serif;
                margin: 20px;
                color: #333;
            }
            .header {
                text-align: center;
                margin-bottom: 40px;
                border-bottom: 2px solid #007bff;
                padding-bottom: 20px;
            }
            .header h1 {
                margin: 0;
                color: #007bff;
            }
            .invoice-info {
                display: flex;
                /*justify-content: space-between;*/
                margin-bottom: 30px;
            }
            .invoice-details, .patient-details {
                width: 50%;
                padding: 0 10px 5px 10px;
            }
            .patient-details {
                background-color: #dedddd;
                border-radius: 5px;
            }
            .invoice-details h3, .patient-details h3 {
                color: #007bff;
                font-size: 14px;
                margin-bottom: 10px;
            }
            .invoice-details p, .patient-details p {
                margin: 5px 0;
                font-size: 13px;
            }
            .table {
                width: 100%;
                border-collapse: collapse;
                margin: 30px 0;
            }
            .table th {
                background-color: #007bff;
                color: white;
                padding: 12px;
                text-align: left;
                font-weight: bold;
            }
            .table td {
                padding: 12px;
                border-bottom: 1px solid #ddd;
            }
            .table tr:last-child td {
                border-bottom: 2px solid #007bff;
            }
            .summary {
                display: flex;
                justify-content: flex-end;
                margin-top: 30px;
            }
            .summary-box {
                width: 300px;
                padding: 20px;
                background-color: #f8f9fa;
                border: 1px solid #ddd;
                border-radius: 5px;
            }
            .summary-row {
                display: flex;
                justify-content: space-between;
                margin-bottom: 10px;
                font-size: 14px;
            }
            .summary-row.total {
                font-weight: bold;
                color: #007bff;
                font-size: 16px;
                border-top: 1px solid #ddd;
                padding-top: 10px;
            }
            .footer {
                text-align: center;
                margin-top: 40px;
                font-size: 12px;
                color: #666;
                border-top: 1px solid #ddd;
                padding-top: 20px;
            }
            .professionnel-info {
                display: flex;
                justify-content: space-between;
                padding-bottom: 80px;
                font-size: 14px;
            }
            .cabinet-info {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .ostheo-info {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .titre-gris {
                color: #8c8b8b;
                margin-bottom: 5px;
            }
        </style>
    <title>Facture</title>
</head>
<body>
<div class="professionnel-info">
    <div class="cabinet-info">
        <span class="titre-gris" th:text="${cabinetName}"></span>
        <span th:text="${cabinetAddress}"></span>
        <span th:text="${cabinetPostalCode} + ' ' + ${cabinetCity}"></span>
        <span th:text="${cabinetCountry}"></span>
    </div>
    <div class="ostheo-info">
        <span class="titre-gris" th:text="${practitionerLabel}"></span>
        <span style="font-weight: bold;" th:text="${practitionerFirstname} + ' ' + ${practitionerLastname}"></span>
        <span th:text="${practitionerPhone}"></span>
        <span th:text="${practitionerEmail}"></span>
        <div style="margin-top: 5px;">
            <span class="titre-gris">N°RPPS : </span><span th:text="${practitionerRPPS}"></span>
        </div>
    </div>
</div>


<div class="header">
    <h1>FACTURE</h1>
</div>

<div class="invoice-info">
    <div class="invoice-details">
        <h3>Informations Facture</h3>
        <p><strong>N° Facture :</strong> <span th:text="${invoiceNumber}"></span></p>
        <p><strong>Moyen de paiement :</strong> <span th:text="${paymentMethod}"></span></p>
    </div>
    <div class="patient-details">
        <h3>Patient</h3>
        <p><span th:text="${patientFirstname}"></span> <span th:text="${patientLastname}"></span></p>
        <p><span th:text="${patientAddress}"></span></p>
        <p><span th:text="${patientPostalCode} + ' ' + ${patientCity}"></span></p>
    </div>
</div>

<table class="table">
    <thead>
    <tr>
        <th>Description</th>
        <th style="text-align: right;">Montant</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td><span th:text="${invoiceConsultLabel}"></span></td>
        <td style="text-align: right;"><span th:text="${amount}"></span> <span th:text="${currency}"></span></td>
    </tr>
    </tbody>
</table>

<div class="summary">
    <div class="summary-box">
        <div class="summary-row total">
            <span>Total :</span>
            <span><span th:text="${amount}"></span> <span th:text="${currency}"></span></span>
        </div>
    </div>
</div>

<div class="footer">
    <p><span th:text="${endText}"></span></p>
</div>
</body>
</html>
